[project]
name = "dualpass"
version = "0.2.0a1"
description = "A reliability-first agent harness with cross-vendor independent review built in."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "Chris Rebentisch", email = "rbntsch@gmail.com" }]
keywords = [
    "agent",
    "agent-harness",
    "llm",
    "claude",
    "cursor",
    "cross-vendor-review",
    "agent-as-judge",
    "dual-pass-review",
    "pipeline",
    "orchestration",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0,<7.0",
    "rich>=13.7,<15.0",
    "jsonschema>=4.21,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.5,<1.0",
]

[project.scripts]
dualpass = "dualpass.cli:main"

[project.urls]
Homepage = "https://github.com/Chris-Rebentisch/dualpass"
Documentation = "https://github.com/Chris-Rebentisch/dualpass/tree/main/docs"
Changelog = "https://github.com/Chris-Rebentisch/dualpass/blob/main/CHANGELOG.md"
Issues = "https://github.com/Chris-Rebentisch/dualpass/issues"

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dualpass"]

# Ship the example project inside the wheel so `dualpass init` can scaffold from
# it on a fresh install where the repo's examples/ tree is not present.
[tool.hatch.build.targets.wheel.force-include]
"examples/coding-agent" = "dualpass/_templates/coding-agent"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "SIM"]
ignore = ["E501"]  # line length handled by formatter
